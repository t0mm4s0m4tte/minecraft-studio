name: Build Multi-Loader & Validate Assets

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  validate-and-build:
    name: Validate LabPBR 1.3, Build Multi-Loader & Package Triptych
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run LabPBR 1.3 Strict Full-Pack Validator (1,620 sets)
        run: python packs/aetheria-labpbr-32x/scripts/validate_labpbr.py --strict --all

      - name: Install Pillow & Generate Contact Sheets
        run: |
          pip install pillow
          python packs/aetheria-labpbr-32x/scripts/generate_contact_sheets.py

      - name: Run Python Static GLSL & Release Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build Fabric & NeoForge Mod
        working-directory: mods/ambient-luminescence
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Package Release Archives (dist/)
        run: python scripts/package_release.py --skip-gradle --skip-validate

      - name: Upload Triptych Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-studio-triptych-packages
          path: |
            dist/*.jar
            dist/*.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            dist/*.zip
          generate_release_notes: true
