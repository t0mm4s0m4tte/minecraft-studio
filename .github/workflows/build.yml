name: Build Multi-Loader & Validate Assets

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-assets:
    name: Validate LabPBR 1.3 Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run LabPBR 1.3 Texture Validator
        run: python packs/aetheria-labpbr-32x/scripts/validate_labpbr.py --strict

  build-mods:
    name: Build Ambient Luminescence (MC 1.21.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build Fabric & NeoForge
        working-directory: mods/ambient-luminescence
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
