pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

plugins {
    id "architectury-plugin" version "3.4.164" apply false
    id "dev.architectury.loom" version "1.7.435" apply false
}

rootProject.name = "ambient-luminescence"

include("common")
include("fabric")
include("neoforge")
