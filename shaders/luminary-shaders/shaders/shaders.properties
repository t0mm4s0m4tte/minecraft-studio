# ==============================================================================
# Luminary Shaders - Iris / Sodium Configuration
# Target: Minecraft 1.21.1 | Zero-Config UX | Target GPU Frame Time <= 3.8 ms
# ==============================================================================

# Profili ufficiali Iris / OptiFine
profile.Potato = !SHADOW_ENABLED DYNAMIC_LIGHTS !PBR_ENABLED !POM_ENABLED AO_QUALITY=0 shadowMapResolution=512
profile.Balanced = SHADOW_ENABLED DYNAMIC_LIGHTS PBR_ENABLED !POM_ENABLED AO_QUALITY=1 shadowMapResolution=1024
profile.Cinematic = SHADOW_ENABLED DYNAMIC_LIGHTS PBR_ENABLED POM_ENABLED AO_QUALITY=2 shadowMapResolution=2048

# Schermata opzioni Iris
screen = PBR_ENABLED DYNAMIC_LIGHTS SHADOW_ENABLED POM_ENABLED AO_QUALITY POM_DEPTH POM_STEPS shadowMapResolution
sliders = AO_QUALITY POM_DEPTH POM_STEPS shadowMapResolution

# Parametri Shadow Map Iris
shadowMapResolution = 1024
shadowDistance = 96.0
shadowIntervalSize = 2.0
sunPathRotation = -40.0

# Direttive LabPBR 1.3 (rilevamento automatico Aetheria LabPBR 32x)
pbr.format = lab_pbr_1_3
custom.pbr = true
oldLighting = false
separateEntityDraws = true
