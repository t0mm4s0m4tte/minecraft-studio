# ==============================================================================
# Luminary Shaders - Iris / Sodium Configuration
# Target: Minecraft 1.21.1 | Zero-Config UX | Target GPU Frame Time <= 3.8 ms
# ==============================================================================

# Buffer HDR e Precisione Render Target
pbr.format = lab_pbr_1_3
custom.pbr = true
oldLighting = false
separateEntityDraws = true

colortex0.format = RGBA16F
colortex1.format = RGBA16F
colortex2.format = RGBA8
colortex3.format = RGBA16F

# Profili ufficiali Iris / OptiFine
profile.Potato = !SHADOW_ENABLED DYNAMIC_LIGHTS !PBR_ENABLED !POM_ENABLED AO_QUALITY=0
profile.Balanced = SHADOW_ENABLED DYNAMIC_LIGHTS PBR_ENABLED POM_ENABLED AO_QUALITY=1 POM_STEPS=10 POM_DEPTH=0.06
profile.Cinematic = SHADOW_ENABLED DYNAMIC_LIGHTS PBR_ENABLED POM_ENABLED AO_QUALITY=2 POM_STEPS=16 POM_DEPTH=0.08

# Schermata opzioni Iris
screen = PBR_ENABLED DYNAMIC_LIGHTS SHADOW_ENABLED POM_ENABLED AO_QUALITY POM_DEPTH POM_STEPS
sliders = AO_QUALITY POM_DEPTH POM_STEPS

# Parametri Shadow Map Iris (2048x2048 + Distorsione 0.85 Simmetrica)
shadowMapResolution = 2048
shadowDistance = 96.0
shadowIntervalSize = 2.0
sunPathRotation = -42.0
