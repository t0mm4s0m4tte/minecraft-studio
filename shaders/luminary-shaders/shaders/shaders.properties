# ==============================================================================
# Luminary Shaders - Iris / Sodium Configuration
# Target: Minecraft 1.21.1 | Zero-Config UX | Target GPU Frame Time <= 3.8 ms
# ==============================================================================

# Presets esposti: Potato, Balanced LabPBR, Cinematic
profile.Potato = PROFILE_POTATO
profile.Balanced = PROFILE_BALANCED
profile.Cinematic = PROFILE_CINEMATIC
profile.default = PROFILE_BALANCED

# ------------------------------------------------------------------------------
# Profili Preset
# ------------------------------------------------------------------------------
# POTATO: Massime prestazioni per integrate Intel/AMD. Zero PBR, shading base rapido
profile.Potato.SHADOW_ENABLED = false
profile.Potato.DYNAMIC_LIGHTS = true
profile.Potato.PBR_ENABLED = false
profile.Potato.POM_ENABLED = false
profile.Potato.AO_QUALITY = 0

# BALANCED LABPBR (Default): PBR 1.3 completo, riflessi analitici, target <= 3.8ms
profile.Balanced.SHADOW_ENABLED = true
profile.Balanced.DYNAMIC_LIGHTS = true
profile.Balanced.PBR_ENABLED = true
profile.Balanced.POM_ENABLED = false
profile.Balanced.AO_QUALITY = 1

# CINEMATIC: PBR + Parallax Occlusion Mapping + SSAO raffinato per showcase
profile.Cinematic.SHADOW_ENABLED = true
profile.Cinematic.DYNAMIC_LIGHTS = true
profile.Cinematic.PBR_ENABLED = true
profile.Cinematic.POM_ENABLED = true
profile.Cinematic.AO_QUALITY = 2

# ------------------------------------------------------------------------------
# Direttive Iris Standard & Rilevamento LabPBR 1.3
# ------------------------------------------------------------------------------
pbr.format = lab_pbr_1_3
custom.pbr = true

# Opzioni di configurazione
option.DYNAMIC_LIGHTS = true
option.DYNAMIC_LIGHTS.comment = Attiva illuminazione dinamica portatile interpolata
option.PBR_ENABLED = true
option.PBR_ENABLED.comment = Abilita calcolo fisicamente corretto su normali e specular LabPBR 1.3
option.SHADOW_ENABLED = true
option.POM_ENABLED = false
option.AO_QUALITY = 1
