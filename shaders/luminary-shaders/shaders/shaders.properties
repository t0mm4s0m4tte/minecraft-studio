# ==============================================================================
# Luminary Shaders - Iris / Sodium Configuration
# Target: Minecraft 1.21.1 | Zero-Config UX | Target GPU Frame Time <= 3.8 ms
# Release: v1.6.0 (Dynamic Weather Splashes, Volumetric Rain & Underwater Shafts)
# ==============================================================================

# Buffer HDR e Precisione Render Target
pbr.format = lab_pbr_1_3
custom.pbr = true
oldLighting = false
separateEntityDraws = true

colortex0.format = RGBA16F
colortex1.format = RGBA16F
colortex2.format = RGBA8
colortex3.format = RGBA16F

# Profili ufficiali Iris / OptiFine
profile.Potato = !SHADOW_ENABLED DYNAMIC_LIGHTS !PBR_ENABLED !POM_ENABLED !RAIN_WETNESS !DYNAMIC_PUDDLES !SSR_ENABLED !VOLUMETRIC_LIGHT !VOLUMETRIC_CLOUDS !WATER_CAUSTICS !FOLIAGE_WAVING !AUTO_EXPOSURE !DOF_ENABLED !CHROMATIC_ABERRATION !AA_SHARPEN !MOTION_BLUR TONEMAP_PRESET=0 AO_QUALITY=0 SSR_QUALITY=0 VOLUMETRIC_QUALITY=0
profile.Balanced = SHADOW_ENABLED DYNAMIC_LIGHTS PBR_ENABLED POM_ENABLED RAIN_WETNESS DYNAMIC_PUDDLES SSR_ENABLED VOLUMETRIC_LIGHT VOLUMETRIC_CLOUDS WATER_CAUSTICS FOLIAGE_WAVING AUTO_EXPOSURE !DOF_ENABLED !CHROMATIC_ABERRATION AA_SHARPEN !MOTION_BLUR TONEMAP_PRESET=0 AO_QUALITY=1 POM_STEPS=10 POM_DEPTH=0.06 SSR_QUALITY=1 VOLUMETRIC_QUALITY=1
profile.Cinematic = SHADOW_ENABLED DYNAMIC_LIGHTS PBR_ENABLED POM_ENABLED RAIN_WETNESS DYNAMIC_PUDDLES SSR_ENABLED VOLUMETRIC_LIGHT VOLUMETRIC_CLOUDS WATER_CAUSTICS FOLIAGE_WAVING AUTO_EXPOSURE DOF_ENABLED CHROMATIC_ABERRATION AA_SHARPEN MOTION_BLUR TONEMAP_PRESET=0 AO_QUALITY=2 POM_STEPS=16 POM_DEPTH=0.08 SSR_QUALITY=2 VOLUMETRIC_QUALITY=2

# Schermata opzioni Iris
screen = PBR_ENABLED DYNAMIC_LIGHTS SHADOW_ENABLED POM_ENABLED RAIN_WETNESS DYNAMIC_PUDDLES SSR_ENABLED VOLUMETRIC_LIGHT VOLUMETRIC_CLOUDS WATER_CAUSTICS FOLIAGE_WAVING AUTO_EXPOSURE DOF_ENABLED CHROMATIC_ABERRATION AA_SHARPEN MOTION_BLUR TONEMAP_PRESET AO_QUALITY POM_DEPTH POM_STEPS SSR_QUALITY VOLUMETRIC_QUALITY
sliders = TONEMAP_PRESET AO_QUALITY POM_DEPTH POM_STEPS SSR_QUALITY VOLUMETRIC_QUALITY

# Parametri Shadow Map Iris (2048x2048 + Distorsione 0.85 Simmetrica)
shadowMapResolution = 2048
shadowDistance = 96.0
shadowIntervalSize = 2.0
sunPathRotation = -42.0
